name: EduData Supabase Auth Tests

on:
  push:
    branches:
      - "security/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-unit-tests.yml"

permissions:
  contents: read

jobs:
  supabase-auth-tests:
    name: Supabase auth and membership regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-only-key
      SUPABASE_ANON_KEY: test-only-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Supabase auth regression tests
        run: python -m unittest discover -s tests -p 'test_current_user_supabase_auth.py' -v

      - name: Run membership resolver tests
        run: python -m unittest discover -s tests -p 'test_membership_resolver.py' -v

      - name: Run request-scoped membership repository tests
        run: python -m unittest discover -s tests -p 'test_membership_repository.py' -v

      - name: Run verified membership dependency tests
        run: python -m unittest discover -s tests -p 'test_current_membership_dependency.py' -v

      - name: Run RLS-scoped Agenda read repository tests
        run: python -m unittest discover -s tests -p 'test_agenda_read_repository.py' -v

      - name: Run Agenda list route security tests
        run: python -m unittest discover -s tests -p 'test_agenda_list_route_security.py' -v

      - name: Run membership user management permission tests
        run: python -m unittest discover -s tests -p 'test_membership_permissions.py' -v

      - name: Run RLS-scoped user directory repository tests
        run: python -m unittest discover -s tests -p 'test_user_access_repository.py' -v
