name: EDI-QI Database

on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  db-rls:
    name: EDI-QI DB / RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Run pgTAP / EDI-QI RLS
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop
