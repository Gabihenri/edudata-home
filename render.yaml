services:
  - type: web
    name: edudata-eios-backend

    runtime: python

    rootDir: backend

    plan: free

    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: |
      uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/v1/intelligence/health

    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: 3.12

      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false